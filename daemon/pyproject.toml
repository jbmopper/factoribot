[project]
name = "factoribot"
version = "0.0.1"
description = "Factoribot brain: production solver + LLM layer for the in-game Factorio assistant"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The solver + agent loop need zero external deps; each provider is opt-in.
openai = ["openai>=2"]
dev = ["pytest"]
planning = ["scipy>=1.11,<2", "jsonschema>=4.20,<5"]
mcp = ["mcp>=1.12,<2", "scipy>=1.11,<2", "jsonschema>=4.20,<5"]

[project.scripts]
factoribot = "factoribot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factoribot*"]
