[project]
name = "factoribot"
version = "0.0.1"
description = "Factoribot brain: production solver + LLM layer for the in-game Factorio assistant"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The solver + agent loop need zero external deps; each provider is opt-in.
openai = ["openai>=2"]
dev = ["pytest"]
planning = ["scipy>=1.11,<2", "jsonschema>=4.20,<5"]
mcp = ["mcp>=1.12,<2", "scipy>=1.11,<2", "jsonschema>=4.20,<5"]

[project.scripts]
factoribot = "factoribot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factoribot*"]

# The routing viewer reads these through `importlib.resources.files`. Package
# discovery alone ships them in an editable install but not in a wheel or sdist,
# so `render_view` would fail from an installed package without this stanza.
#
# `evidence/` is the pinned routing-prototype extract and mechanics-observation
# records that `transport_prototypes.py` resolves relative to its own file
# (`Path(__file__).resolve().parent / "evidence" / ...`). Without this stanza
# they ship in an editable install but not in a wheel or sdist, and
# `load_pinned_extract()` fails from an installed package.
[tool.setuptools.package-data]
factoribot = [
    "blueprint_view_assets/*.html",
    "blueprint_view_assets/*.css",
    "blueprint_view_assets/*.js",
    "evidence/routing_prototypes/*.json",
    "evidence/routing_prototypes/*.md",
    "evidence/routing_prototypes/*.py",
    "evidence/routing_mechanics_observations/*.json",
    "evidence/routing_mechanics_observations/*.md",
    "evidence/routing_mechanics_observations/records/*.json",
]
